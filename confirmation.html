<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed | Saint Omen</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <div class="logo">SAINT OMEN</div>
</nav>

<section class="confirmation-page">

    <div class="checkmark">✓</div>

    <h1>ORDER CONFIRMED</h1>

    <p class="confirm-text">
        Thank you for choosing Saint Omen.
    </p>

    <div class="order-card">

        <p><strong>Order:</strong> <span id="orderNumber"></span></p>

        <div id="orderItems"></div>

        <h3 id="orderTotal"></h3>

    </div>

    <button class="cart-btn" onclick="continueWhatsApp()">
        CONTINUE TO WHATSAPP
    </button>

</section>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let order = Math.floor(1000 + Math.random() * 9000);

document.getElementById("orderNumber").innerText = "SO-" + order;

let total = 0;
let items = document.getElementById("orderItems");

cart.forEach(item => {
    total += item.price;

    items.innerHTML += `
        <p>${item.name} (${item.size}) — R${item.price}</p>
    `;
});

document.getElementById("orderTotal").innerText = "Total: R" + total;

function continueWhatsApp(){

    let message = `Hi Saint Omen,%0A%0A`;
    message += `Order: SO-${order}%0A%0A`;

    cart.forEach(item=>{
        message += `- ${item.name} (${item.size}) - R${item.price}%0A`;
    });

    message += `%0ATotal: R${total}`;

    localStorage.removeItem("cart");

    window.location.href =
    "https://wa.me/27766153367?text=" + message;
}
</script>

</body>
</html>
